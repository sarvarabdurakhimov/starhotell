databases:
  - name: starhotel-db
    plan: free
    databaseName: starhotel
    user: starhotel

services:
  - type: web
    name: starhotel-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/schema/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.render
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: starhotel-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      # Browser requests arrive through the Vercel frontend proxy
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://starhotel.vercel.app
      - key: FRONTEND_URL
        value: https://starhotel.vercel.app
      # Public https address of this backend: Telegram bots then use a webhook
      - key: PUBLIC_API_URL
        value: https://starhotel-backend.onrender.com
